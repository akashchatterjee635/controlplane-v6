# ControlPlane — Use-Case Policy Profiles
# Each profile overrides fields from "default".
# The router, validators, and decision layer all read from the active profile.

default:
  pii_policy: redact
  hallucination_check: strict
  human_review_threshold: 0.65
  complexity_fast_max: 4
  risk_fast_max: 2
  forced_verified_domains:
    - medical
    - legal
    - financial
    - regulated
    - security_sensitive
  prohibited_keywords:
    - "ignore previous instructions"
    - "ignore all previous instructions"
    - "act as root"
    - "bypass safety"

customer_support:
  pii_policy: redact
  hallucination_check: strict
  human_review_threshold: 0.65
  complexity_fast_max: 3
  risk_fast_max: 1
  forced_verified_domains:
    - medical
    - legal
    - financial
    - regulated
    - security_sensitive
  prohibited_keywords:
    - "ignore previous instructions"
    - "ignore all previous instructions"
    - "act as root"
    - "bypass safety"

internal_knowledge:
  pii_policy: redact
  hallucination_check: medium
  human_review_threshold: 0.45
  complexity_fast_max: 6
  risk_fast_max: 3
  policy_violation_action: review
  forced_verified_domains:
    - medical
    - legal
    - financial
    - regulated
    - security_sensitive
  prohibited_keywords:
    - "ignore previous instructions"
    - "ignore all previous instructions"
    - "act as root"
    - "bypass safety"

decision_support:
  pii_policy: redact
  hallucination_check: strict
  human_review_threshold: 0.80
  complexity_fast_max: 2
  risk_fast_max: 1
  forced_verified_domains:
    - medical
    - legal
    - financial
    - regulated
    - security_sensitive
  prohibited_keywords:
    - "ignore previous instructions"
    - "ignore all previous instructions"
    - "act as root"
    - "bypass safety"

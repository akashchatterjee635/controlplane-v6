# ControlPlane v6 — Docker Compose
# Services: API (FastAPI + LangGraph) and UI (Streamlit)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-api
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_PATH=/app/data/chroma_db
      - SQLITE_CHECKPOINT_PATH=/app/data/checkpoints.db
    volumes:
      - controlplane-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-ui
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "ui/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    restart: unless-stopped

  # One-off service to seed the knowledge base
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-seed
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_PATH=/app/data/chroma_db
    volumes:
      - controlplane-data:/app/data
    command: ["python", "data/knowledge_base/seed_data.py"]
    profiles:
      - setup

volumes:
  controlplane-data:
    driver: local
